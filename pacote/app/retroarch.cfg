# retroarch.cfg mínimo para o X39 dentro do x39jail.
# /app = pacote (somente leitura); /data = pasta gravável no cartão; /roms = jogos (somente leitura)

# vídeo: driver genérico sdl (fbcon por software). O sdl_powkiddy exige /dev/mem e fica de fora.
video_driver = "sdl"
video_fullscreen = "true"
video_vsync = "false"
video_threaded = "true"
video_force_aspect = "true"
video_font_enable = "true"
video_smooth = "false"

# áudio (tinyalsa embutido; o mixer é configurado por fora da jaula)
audio_driver = "tinyalsa"
audio_device = "hw0"
audio_enable = "true"
audio_out_rate = "48000"
audio_latency = "160"
audio_resampler = "nearest"
audio_sync = "true"
audio_volume = "-8.000000"

# entrada: SDL com o joystick do console (js0)
input_driver = "sdl"
input_joypad_driver = "sdl"
input_autodetect_enable = "false"
input_max_users = "1"
input_player1_analog_dpad_mode = "1"
input_player1_up_axis = "-1"
input_player1_down_axis = "+1"
input_player1_left_axis = "-0"
input_player1_right_axis = "+0"
input_player1_up_btn = "14"
input_player1_left_btn = "15"
input_player1_right_btn = "16"
input_player1_down_btn = "17"
input_player1_l_x_plus_axis = "+0"
input_player1_l_x_minus_axis = "-0"
input_player1_l_y_plus_axis = "+1"
input_player1_l_y_minus_axis = "-1"
input_player1_a_btn = "3"
input_player1_b_btn = "0"
input_player1_x_btn = "2"
input_player1_y_btn = "1"
input_player1_l_btn = "5"
input_player1_r_btn = "4"
input_player1_l2_btn = "7"
input_player1_r2_btn = "6"
input_player1_select_btn = "8"
input_player1_start_btn = "9"
input_menu_toggle_btn = "10"
# volume pelos botões do console (números do SDL do fork para KEY_VOLUMEUP/DOWN); o RetroArch mostra o valor na tela
input_volume_up_btn = "11"
input_volume_down_btn = "12"
notification_show_volume = "true"
input_exit_emulator_btn = "13"

# menu
menu_driver = "rgui"

# caminhos (nada fora de /app e /data)
libretro_directory = "/app/cores"
libretro_info_path = "/app/info"
system_directory = "/data/system"
savefile_directory = "/data/saves"
savestate_directory = "/data/states"
screenshot_directory = "/data/screens"
cache_directory = "/tmp"
log_dir = "/tmp"
log_to_file = "false"
config_save_on_exit = "false"
content_history_size = "0"
content_favorites_size = "0"
content_image_history_size = "0"
content_music_history_size = "0"
content_video_history_size = "0"
core_info_cache_enable = "false"

# desligado: rede, atualizadores, conquistas, câmera, localização, etc.
core_updater_buildbot_cores_url = ""
core_updater_buildbot_assets_url = ""
menu_show_online_updater = "false"
menu_show_core_updater = "false"
cheevos_enable = "false"
camera_allow = "false"
location_allow = "false"
discord_allow = "false"
netplay_public_announce = "false"
network_cmd_enable = "false"
stdin_cmd_enable = "false"
