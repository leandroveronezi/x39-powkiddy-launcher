# Mapeamento PROVISÓRIO do jogador 2 (controle USB na porta USB-A 2). Só linhas input_player2_* valem.
# Números de botão/eixo do SDL 1.2 do console; controles diferentes numeram diferente. Para um controle específico
# crie <vendor>-<produto>.cfg ao lado deste (ex.: 0079-0011.cfg; os códigos aparecem em /proc/bus/input/devices),
# calibrado com tools/diagnostico/evlog. O índice do controle (joypad_index) é fixado pelo lançador.
input_player2_up_axis = "-1"
input_player2_down_axis = "+1"
input_player2_left_axis = "-0"
input_player2_right_axis = "+0"
input_player2_a_btn = "1"
input_player2_b_btn = "2"
input_player2_x_btn = "0"
input_player2_y_btn = "3"
input_player2_l_btn = "4"
input_player2_r_btn = "5"
input_player2_select_btn = "8"
input_player2_start_btn = "9"
